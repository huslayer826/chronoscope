<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChronoScope</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 250px;
        height: 180px;
        background: #15171c;
        color: #e6e9ef;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
      }
      .wrap {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .title {
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.2px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #9aa3b2;
        font-size: 12px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #555;
        box-shadow: 0 0 0 0 rgba(0,0,0,0);
        transition: background 120ms ease;
      }
      .dot.on {
        background: #2bd47d;
        box-shadow: 0 0 6px rgba(43, 212, 125, 0.6);
      }
      .dot.off {
        background: #ef5b5b;
        box-shadow: 0 0 6px rgba(239, 91, 91, 0.5);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-top: 1px solid #23262d;
      }
      .row:first-of-type { border-top: none; }
      .label { color: #cfd4de; }
      .hint {
        margin-top: auto;
        font-size: 11px;
        color: #6b7280;
        text-align: center;
      }

      .switch {
        position: relative;
        width: 34px;
        height: 18px;
      }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #2a2e38;
        border-radius: 18px;
        transition: 120ms;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 14px;
        width: 14px;
        left: 2px;
        top: 2px;
        background-color: #d6d9e0;
        border-radius: 50%;
        transition: 120ms;
      }
      input:checked + .slider { background-color: #3b82f6; }
      input:checked + .slider::before { transform: translateX(16px); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="title">ChronoScope</div>
        <div class="status">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">…</span>
        </div>
      </header>

      <div class="row">
        <span class="label">Enabled</span>
        <label class="switch">
          <input type="checkbox" id="enabledToggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <span class="label">Track incognito</span>
        <label class="switch">
          <input type="checkbox" id="incognitoToggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="hint">ws://127.0.0.1:8765/extension</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
